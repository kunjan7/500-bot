name: 500-0 freq-drafter 24/7
on:
  schedule:
    - cron: "0 * * * *"   # every hour — 100% free, no card. Change to "*/30 * * * *" for every 30m
  workflow_dispatch:       # manual Run button
  push:
    branches: [main]

jobs:
  draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run fastest drafter (<35 overs hunt, distinct cloud handle)
        env:
          HANDLE: ${{ secrets.HANDLE_CLOUD || 'kunjan1387c' }}
          MAX_DRAFTS: "30"     # 30 drafts per hour ≈ 50 min
          HOLD_SEC: "20"       # wait 20s after win then continue
          TARGET_BALLS: "209"  # <210 = <35.0 overs
          STOP_ON_TARGET: "0"  # keep looping, set 1 to stop on <35
        run: xvfb-run --auto-servernum python spin_fastest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.run_number }}
          path: shots_hack/
          retention-days: 7
