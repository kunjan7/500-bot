name: 500-0 freq-drafter 24/7
on:
  schedule:
    # Hourly trigger; the bot randomly skips ~55% of sessions and delays
    # its start 0-10 min, so live sessions land at patternless times, 24/7.
    # Daily hard cap: 50 drafts (see STATE.json). ~70% win rate ≈ 35 wins/day.
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
      - run: python -m playwright install-deps chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
      - name: Run drafter (short human-like session)
        env:
          HANDLE: ${{ secrets.HANDLE || 'CoverDriveKing07' }}
          HOLD_SEC: "10"
          SEED_DELAY: "2"
          SKIP_PROB: "0.55"
          DAILY_CAP: "50"
        run: |
          git config user.name "live-log-bot"
          git config user.email "live-log-bot@users.noreply.github.com"
          xvfb-run --auto-servernum python spin_fixed11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.run_number }}
          path: shots_fixed11/
          retention-days: 7
