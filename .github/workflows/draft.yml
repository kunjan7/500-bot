name: 500-0 freq-drafter 24/7
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min — 48 runs/day × 20 drafts = 960 attempts
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
      - run: python -m playwright install-deps chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
      - name: Run FIXED11 drafter (15min session)
        env:
          HANDLE: ${{ secrets.HANDLE || 'kumar6071' }}
          MAX_DRAFTS: "20"
          HOLD_SEC: "10"       # 10s hold after each win
          SEED_DELAY: "2"      # 2s delay between API calls
        run: xvfb-run --auto-servernum python spin_fixed11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.run_number }}
          path: shots_fixed11/
          retention-days: 7
