name: 500-0 freq-drafter 24/7
on:
  schedule:
    # 15-min human-like sessions, every 2h while awake.
    # UTC hours -> IST: 06:37, 08:37, 10:37, 12:37, 14:37, 16:37, 18:37, 20:37, 22:37.
    # Quiet ~23:00-06:30 IST (sleep). Weekends grind more drafts (see code).
    - cron: "7 1,3,5,7,9,11,13,15,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
      - run: python -m playwright install-deps chromium
        if: steps.cache-pw.outputs.cache-hit != 'true'
      - name: Run drafter (15min human-like session)
        env:
          HANDLE: ${{ secrets.HANDLE || 'kumar6071' }}
          # MAX_DRAFTS intentionally unset: code randomizes 4-6 (weekday) / 8-10 (weekend)
          HOLD_SEC: "10"
          SEED_DELAY: "2"
        run: xvfb-run --auto-servernum python spin_fixed11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.run_number }}
          path: shots_fixed11/
          retention-days: 7
