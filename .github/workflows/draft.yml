name: 500-0 freq-drafter 24/7
on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours — 12 runs/day × 50 drafts = 600 attempts
  workflow_dispatch:         # manual Run button
  push:
    branches: [main]

jobs:
  draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run FIXED11 drafter (50 drafts, 30s hold, kumar6071)
        env:
          HANDLE: ${{ secrets.HANDLE || 'kumar6071' }}
          MAX_DRAFTS: "50"
          HOLD_SEC: "45"       # 45s hold after each win for leaderboard to update
          SEED_DELAY: "5"      # 5s delay between API calls to avoid rate limit
        run: xvfb-run --auto-servernum python spin_fixed11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.run_number }}
          path: shots_fixed11/
          retention-days: 7
