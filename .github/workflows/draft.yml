name: 500-0 freq-drafter 24/7
on:
  schedule:
    - cron: "0 * * * *"   # every hour — 100% free, no card. Change to "*/30 * * * *" for every 30m
  workflow_dispatch:       # manual Run button
  push:
    branches: [main]

jobs:
  draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run freq drafter (<35 overs hunt, distinct cloud handle)
        env:
          HANDLE: ${{ secrets.HANDLE_CLOUD || 'kunjan700' }}
          MAX_DRAFTS: "15"     # 15 drafts ≈ 18 min - need many tries for <39 overs (top100) to post
          HOLD_SEC: "2"
          EXPLORE: "1"
        run: xvfb-run --auto-servernum python spin_freq.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.run_number }}
          path: shots_hack/
          retention-days: 7
