name: 500-0 freq-drafter 24/7
on:
  schedule:
    - cron: "0 * * * *"   # every hour — 100% free, no card. Change to "*/30 * * * *" for every 30m
  workflow_dispatch:       # manual Run button
  push:
    branches: [main]

jobs:
  draft:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run FIXED11 drafter (infinite loop, 1000 drafts, 20s hold)
        env:
          HANDLE: ${{ secrets.HANDLE || 'kunjan700' }}
          MAX_DRAFTS: "1000"   # infinite loop per run (55 min timeout ≈ 35 drafts)
          HOLD_SEC: "20"       # 20s hold as earlier
        run: xvfb-run --auto-servernum python spin_fixed11.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.run_number }}
          path: shots_hack/
          retention-days: 7
